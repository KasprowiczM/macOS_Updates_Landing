<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Theme bootstrap: runs before first paint so prerendered HTML never flashes the wrong theme. -->
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem('macos-updates-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          try { t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch (e) { t = 'dark'; }
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="alternate icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F7F9FC" media="(prefers-color-scheme: light)" />
    <meta name="author" content="KasprowiczM" />
    <meta name="keywords" content="macos updates, apple silicon, homebrew, app store, mas, softwareupdate, bash, open source, cli updater" />
    <!-- AI / agent discoverability: plain-text summaries of the site. -->
    <link rel="alternate" type="text/markdown" href="/llms.txt" title="llms.txt" />
    <link rel="alternate" type="text/markdown" href="/llms-full.txt" title="llms-full.txt" />

    <!--
      Per-route title, description, robots, canonical, hreflang, Open Graph,
      Twitter tags and JSON-LD are written here at build time by
      scripts/prerender.mjs from src/components/Seo.tsx (React 19 + react-helmet-async)
      and managed by the same component in the browser. Nothing else in this file
      defines them, so every page has exactly one set.
    -->
    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
